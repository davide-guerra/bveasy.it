    <style>
        :root {
            --background-color: #f7f7f7;
            --main-color: #000024;
            --secondary-color: #ce0000;
            --text-color: #ffffff;
            --page-text-color: #111111;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 2rem;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-color);
            background: var(--background-color);
            padding-top: 1rem;
            padding-bottom: 1rem;
            box-sizing: border-box;
        }
        
        @media screen and (min-width: 900px) {
            body {
                gap: 3rem;
            }
        }
        div#main-content-wrapper {
            width: 90%;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            background: var(--main-color);
            padding: 2rem;
            box-sizing: border-box;
            color: var(--text-color);
        }
        @media screen and (min-width: 1200px) {
            div#main-content-wrapper {
                width: 50%;
                padding: 1.5rem;
            }
        }
        @media screen and (min-width: 1400px) {
            div#main-content-wrapper {
                width: 40%;
            }
        }
        div#main-content-top {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            background: var(--main-color);
            align-items: center;
            padding: 1.5rem;
        }
        @media screen and (min-width: 820px) {
            div#main-content-top {
                flex-direction: row;
                gap: 1rem;
            }
        }
        div#top {
            display: none;
        }
        @media screen and (min-width: 1200px) {
            div#top {
                display: flex;
                justify-content: space-between;
                padding-bottom: 2rem;
                border-bottom: 1px solid var(--text-color);
                margin-bottom: 2rem;
            }
        }
        div#name {
            display: flex;
            align-items: center;
            gap: .5rem;
            font-weight: bold;
            font-size: 1.25rem;
        }
        div#name svg  {
            fill: var(--text-color);
            height: 1.5rem;
        }
        div#download-big {
            display: flex;
            flex-direction: column;
            gap: .5rem;
        }
        div#download-big svg  {
            fill: var(--text-color);
            height: 1.25rem;
        }
        div#download-big a {
            display: flex;
            align-items: center;
            gap: .9rem;
            font-size: .9rem;
            color: var(--text-color);
            text-decoration: none;
        }
        div#bottom {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        div#image {
            display: flex;
            justify-content: flex-start;
        }
        div#image img {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            border-radius: 20px;
        }
        @media screen and (min-width: 1200px) {
            div#bottom {
                flex-direction: row;
            }
            div#image {
                display: unset;
                flex-basis: 33%;
            }
            div#details {
                flex-basis: 66%;
            }
            div#image img {
                width: 100%;
            }
        }
        div#details {
            display: flex;
            flex-direction: column;
            gap: .5rem;
        }
        div#name-small {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: .5rem;
            font-weight: bold;
            font-size: 1.25rem;
        }
        @media screen and (min-width: 1200px) {
            div#name-small {
                display: none;
            }
        }
        div#name-small svg {
            height: 2rem;
            fill: var(--text-color);
        }
        div#profession-wrapper {
            display: flex;
            flex-direction: column;
            gap: .5rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--text-color);
            margin-bottom: 2rem;
        }
        span#profession {
            font-weight: bold;
            font-size: 1.25rem;
        }
        span#company {
            font-size: 1rem;
        }
        span#piva {
            font-size: .7rem;
        }
        div#contacts-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        div#contacts-wrapper svg {
            fill: var(--text-color);
            height: 1rem;
        }
        div#contacts-wrapper a {
            display: flex;
            gap: .5rem;
            color: var(--text-color);
            text-decoration: none;
        }
        div#download-small {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding-top: 2rem;
            border-top: 1px solid var(--text-color);
            margin-top: 2rem;
        }
        @media screen and (min-width: 1200px){
            div#download-small {
                display: none;
            }
        }
        div#download-small a {
            display: flex;
            gap: .5rem;
            align-items: center;
            color: var(--text-color);
            text-decoration: none;
            font-size: 1.2rem
        }
        div#download-small svg {
            fill: var(--text-color);
            height: 1.25rem;
        }
        div#overlay {
            position: fixed;
            background: #000000e0;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100%;
            display: none;
            z-index: 2;
        }
        div#overlay.active {
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
        }
        div#qr-code-wrapper {
            display: none;
        }
        div#qr-code-wrapper.active {
            display: block;
            z-index: 9;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        img#qr-code-image {
            display: none;
        }
        img#qr-code-image.active {
            display: block;
        }
        svg#close-overlay {
            height: 2.5rem;
            cursor: pointer;
            padding: 1rem;
        }
        a#power {
            bottom: 1rem;
            right: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .2rem;
            font-size: .75rem;
            color: #000;
            text-decoration: none;
        }
        a#power img {
            width: 5rem;
        }
        @media screen and (min-width: 1200px) {
            a#power {
                flex-direction: row;
                position: fixed;
            }
        }

        /* --- Aggiunte gestite da BVeasy --- */
        div#details.no-photo { flex-basis: 100%; }
        span#piva { opacity: .85; }
        p#bio {
            margin: 0 0 2rem;
            font-size: .95rem;
            line-height: 1.55;
            opacity: .92;
        }
        div#contacts-wrapper a span { word-break: break-word; }
        div#contacts-wrapper a:hover span { text-decoration: underline; text-decoration-color: var(--secondary-color); text-underline-offset: 3px; }
        div#socials-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: .75rem;
            margin-top: 2rem;
        }
        div#socials-wrapper a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.6rem;
            height: 2.6rem;
            border-radius: 50%;
            border: 1px solid var(--text-color);
            transition: background .2s, border-color .2s;
        }
        div#socials-wrapper a:hover { background: var(--secondary-color); border-color: var(--secondary-color); }
        div#socials-wrapper svg { height: 1.1rem; width: 1.1rem; fill: var(--text-color); }
        div#qr-code-wrapper.active { background: #fff; padding: 1rem; border-radius: 12px; }
        img#qr-code-image.active { width: min(70vw, 320px); height: auto; }
        svg#close-overlay { color: #fff; }
        a#power { color: var(--page-text-color); }
        div#booking-wrapper { width: 90%; }
        @media screen and (min-width: 1200px) { div#booking-wrapper { width: 50%; } }
        @media screen and (min-width: 1400px) { div#booking-wrapper { width: 40%; } }
        div#booking-wrapper .bvb { width: 100%; }
    </style>
